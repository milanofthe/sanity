name: Release

# A published release builds the installers and attaches them to it. The
# release itself, with its notes, is made by `npm run release`; see
# scripts/release.mjs. The workflow only uploads: GITHUB_TOKEN stopped being
# allowed to create releases here while uploading to one still works, and a
# release that exists before the build also goes out with its notes rather
# than having them added afterwards.
#
# `workflow_dispatch` runs the same build without publishing anything, which
# is how a change to this file or to the platform code gets checked before a
# version number is spent on it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Every platform is reported even when one of them fails: a broken
      # Windows build should not hide a working macOS one.
      fail-fast: false
      matrix:
        include:
          # `universal-apple-darwin` is a Tauri target, not a rustup one: the
          # two real architectures have to be installed and Tauri lipos the
          # results together.
          - platform: macos-latest
            target: universal-apple-darwin
            toolchains: aarch64-apple-darwin,x86_64-apple-darwin
            name: macOS
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            toolchains: x86_64-pc-windows-msvc
            name: Windows
          # 22.04, and not the newest image, because of what an AppImage does
          # and does not carry. It brings its own GTK and WebKit but not
          # glibc, so the oldest runner that still has the WebKitGTK headers
          # is what decides which machines can run the result: 22.04 puts the
          # floor at glibc 2.35, which reaches Debian 12 and RHEL 9, where
          # 24.04 raises it to 2.39 and leaves both out. When this image goes,
          # the choice is 24.04 and a higher floor or this job in a container.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            toolchains: x86_64-unknown-linux-gnu
            name: Linux
            # One file for every distribution, rather than a .deb and a .rpm
            # that are each right for one family and missing for the rest.
            bundles: appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchains }}
      # WebKitGTK is the webview on Linux and nothing vendors it, so it has to
      # be on the machine to link against. `librsvg2-dev` brings the pixbuf
      # loader GTK draws its own icons through, and `patchelf` and `file` are
      # what linuxdeploy rewrites the AppImage's library paths with. Tauri's
      # prerequisites also name libxdo and appindicator; this app builds
      # neither a tray icon nor anything that links them. The GStreamer
      # plugins are where the few the AppImage carries are taken from; see the
      # next step. Before the cache, so a cache hit still gets these.
      - name: Install the Linux system dependencies
        if: ${{ matrix.name == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            patchelf \
            file
      # WebKitGTK encodes the history video through GStreamer, and without
      # plugins inside the AppImage it finds no encoder on any machine. This
      # picks the handful it needs, VP9 and what feeds it, and tells
      # linuxdeploy's GStreamer plugin (`bundleMediaFramework`) to copy those
      # instead of everything the runner has.
      - name: Gather the GStreamer plugins the AppImage carries
        if: ${{ matrix.name == 'Linux' }}
        run: scripts/appimage-gstreamer.sh "$RUNNER_TEMP/gstreamer" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.target }}
      # The frontend is built by `beforeBuildCommand`, which needs its
      # dependencies to be there first.
      - name: Install the frontend's dependencies
        working-directory: web
        run: npm ci
      - name: Install the Tauri CLI
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `--bundles` only where the matrix names one. macOS and Windows
          # leave it off and keep `targets: "all"` from tauri.conf.json, which
          # is what gives them a .dmg and both Windows installers.
          args: --target ${{ matrix.target }}${{ matrix.bundles && format(' --bundles {0}', matrix.bundles) || '' }}
          # Empty on a dispatch run, which builds without touching releases.
          releaseId: ${{ github.event.release.id }}
      - name: Keep the bundles when nothing is being released
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: sanity-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
