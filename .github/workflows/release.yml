name: Release

# A tag builds the installers and opens a draft release with them attached.
# `workflow_dispatch` runs the same build without publishing anything, which
# is how a change to this file or to the platform code gets checked before a
# version number is spent on it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Both platforms are reported even when one of them fails: a broken
      # Windows build should not hide a working macOS one.
      fail-fast: false
      matrix:
        include:
          # `universal-apple-darwin` is a Tauri target, not a rustup one: the
          # two real architectures have to be installed and Tauri lipos the
          # results together.
          - platform: macos-latest
            target: universal-apple-darwin
            toolchains: aarch64-apple-darwin,x86_64-apple-darwin
            name: macOS
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            toolchains: x86_64-pc-windows-msvc
            name: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchains }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.target }}
      # The frontend is built by `beforeBuildCommand`, which needs its
      # dependencies to be there first.
      - name: Install the frontend's dependencies
        working-directory: web
        run: npm ci
      - name: Install the Tauri CLI
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Empty on a dispatch run, which builds without touching releases.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: sanity ${{ github.ref_name }}
          # A tag is the decision, so there is nothing left to confirm
          # afterwards: the release goes out with the tag that made it.
          releaseDraft: false
          prerelease: false
          # Neither build is signed: there is no Apple Developer certificate
          # and no Windows code signing certificate behind this repository. So
          # the release says what a first launch looks like instead of leaving
          # people at a dialog with no button; see issue #22.
          releaseBody: |
            Download the file for your machine, install it, open a folder.

            **macOS** (`.dmg`, Intel and Apple Silicon in one): the build is
            not notarised, so the first launch needs a right click on the app
            and then Open, which gives you a dialog that has an Open button.
            Double clicking it gives you one that does not.

            **Windows** (`.exe` installer, or the `.msi`): the build is not
            signed, so SmartScreen shows "Windows protected your PC". More
            info, then Run anyway.
      # The app itself, for the npm packages the job below makes. The .app
      # is tarred because an artifact does not keep file modes, and without
      # its mode the app is not executable.
      - name: Keep the app for npm
        shell: bash
        run: |
          mkdir -p npm-out
          if [ "${{ matrix.name }}" = macOS ]; then
            tar czf npm-out/sanity-app.tgz -C target/${{ matrix.target }}/release/bundle/macos sanity.app
          else
            cp target/${{ matrix.target }}/release/sanity.exe npm-out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.name }}
          path: npm-out/*
          if-no-files-found: error
      - name: Keep the bundles when nothing is being released
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sanity-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn

  # The same app on npm, as @milanofthe/sanity and one package per platform;
  # see scripts/npm-packages.mjs. Published from a tag when the repository
  # has an NPM_TOKEN, and only packed on a dispatch run, which is how this
  # job is checked without a version being spent on it.
  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the provenance statement npm shows next to the package.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-in
          merge-multiple: true
      - name: Assemble the packages
        run: |
          tar xzf npm-in/sanity-app.tgz -C npm-in
          node scripts/npm-packages.mjs --out dist/npm --mac npm-in/sanity.app --win npm-in/sanity.exe
      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set, so nothing was published to npm"
            exit 0
          fi
          # The platform packages first: the main one depends on them.
          for p in sanity-darwin-universal sanity-win32-x64 sanity; do
            (cd "dist/npm/$p" && npm publish --access public --provenance)
          done
      - name: Pack, when nothing is being released
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: for p in dist/npm/*/; do (cd "$p" && npm pack --dry-run); done
