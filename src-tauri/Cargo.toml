[package]
name = "sanity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Structural overview of a repository"

[lib]
name = "sanity_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sanity-core = { path = "../crates/sanity-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The only way to FSEvents and inotify short of writing the FFI by hand.
# Default features off: they pull in crossbeam-channel, and the watch thread
# uses std's channel.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
