[package]
name = "sanity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Structural overview of a repository"

[lib]
name = "sanity_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sanity-core = { path = "../crates/sanity-core" }
sanity-watch = { path = "../crates/sanity-watch" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The pages of a PDF, through CoreGraphics; see src/pdf.rs. Already in the
# tree through Tauri, so this names features, not new code to build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGPDFDocument",
    "CGPDFPage",
    "CGContext",
    "CGBitmapContext",
    "CGColorSpace",
    "CGImage",
    "CGAffineTransform",
] }
