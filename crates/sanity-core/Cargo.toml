[package]
name = "sanity-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Repository scanning, tokenisation and change tracking for sanity"

[dependencies]
# Thumbnails, so the frontend never decodes a multi-megapixel source to fill a
# panel a hundred pixels wide. Default features off: this needs the raster
# formats a repository actually holds, not the whole set, and every one of the
# 27 crates it pulls in is pure Rust under MIT or Apache-2.0.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
serde_json = "1"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
# The latex-lsp grammar. Published under this name because the
# canonical crate stopped at 0.1.0; it parses real papers cleanly
# while `tree-sitter-latex` ships its query commented out.
codebook-tree-sitter-latex = "0.6.1"
tree-sitter-yaml = "0.7.2"

[dev-dependencies]
