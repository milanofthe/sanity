<!doctype html>
<html lang="en" data-theme="sanity">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>sanity</title>
    <meta
      name="description"
      content="Every file in a repository on one zoomable canvas, so you can see what a coding agent is changing and where."
    />
    <!-- The card image is an export the app made of itself, see lib/image.ts,
         which is the honest thing to put on a link to it. -->
    <meta property="og:title" content="sanity" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sanity.milanrother.com/" />
    <meta
      property="og:description"
      content="Every file in a repository on one zoomable canvas, so you can see what a coding agent is changing and where."
    />
    <meta property="og:image" content="https://sanity.milanrother.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The SVG is what every current browser uses, at whatever size it wants.
         The PNG is for the ones that do not, and for the places that ask for a
         bitmap regardless: a bookmark bar, a pinned tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <meta name="theme-color" content="#16181a" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
